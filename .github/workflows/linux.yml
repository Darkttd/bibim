# Build the engine core on Linux and run the unit tests (see CMakeLists.txt, tests/).
name: Linux

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # name is the status check name; Debug and Release are required on master.
        include:
          - name: Debug
            build_type: Debug
          - name: Release
            build_type: Release
          # AddressSanitizer (with LeakSanitizer): out-of-bounds reads and
          # writes, use after free and leaks that ordinary builds pass silently.
          - name: ASan
            build_type: Debug
            sanitize_flags: -fsanitize=address -fno-omit-frame-pointer
          # UndefinedBehaviorSanitizer: signed overflow, oversized shifts, bad
          # casts and the like. -fno-sanitize-recover makes the first finding fail
          # the test run instead of only printing a message.
          - name: UBSan
            build_type: Debug
            sanitize_flags: -fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v7

      # libgles-dev / libegl-dev: OpenGL ES 2.0 and EGL headers used by the GLES2 renderer.
      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgles-dev libegl-dev

      - name: Configure
        run: >
          cmake -S . -B build-linux -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          "-DCMAKE_C_FLAGS=${{ matrix.sanitize_flags }}"
          "-DCMAKE_CXX_FLAGS=${{ matrix.sanitize_flags }}"
          "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.sanitize_flags }}"

      - name: Build
        run: cmake --build build-linux

      - name: Test
        run: ctest --test-dir build-linux --output-on-failure
