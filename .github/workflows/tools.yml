# Build the C# asset tools (tools/) with Mono on Linux and run the smoke tests
# in .github/scripts/tools-smoke.sh. The WPF app (tools/Bibim.Baaaaaab) cannot
# be built on Linux, so this builds the CLI host, which also builds the Toolkit.
name: Tools

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  mono:
    name: Tools (Mono)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # Mono is not preinstalled on ubuntu-26.04. mono-devel (6.14, universe)
      # includes xbuild; there is no mono-complete or msbuild package. xbuild
      # warns that its toolset does not support v4.8 but builds against
      # /usr/lib/mono/4.8-api (see README.md).
      - name: Install Mono
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mono-devel
          mono --version

      - name: Build
        run: xbuild /p:Configuration=Release tools/Bibim.Baaaaaab.Cli/Bibim.Baaaaaab.Cli.csproj

      - name: Smoke tests
        run: .github/scripts/tools-smoke.sh Release
